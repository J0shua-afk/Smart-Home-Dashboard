# Mosquitto configuration for the Smart Home dashboard.
#
# The Python scripts publish over plain TCP on 1883. A browser cannot open a
# raw TCP socket, so the broker needs a second listener that speaks MQTT over
# WebSockets. Both listeners share the same broker and the same messages.
#
# Windows:
#   1. Copy this file next to mosquitto.exe, usually
#      C:\Program Files\mosquitto\
#   2. Stop the background service so it does not hold port 1883:
#          net stop mosquitto
#   3. Start the broker with this config from an admin terminal:
#          mosquitto -c mosquitto-websockets.conf -v
#
# macOS / Linux:
#          mosquitto -c mosquitto-websockets.conf -v

# EDIT HERE: the port your Python publishers connect to.
listener 1883
protocol mqtt

# EDIT HERE: the port the dashboard connects to (ws://localhost:9001).
listener 9001
protocol websockets

# Fine for a local demo on your own machine. Do not expose this broker to a
# network without adding authentication.
allow_anonymous true
